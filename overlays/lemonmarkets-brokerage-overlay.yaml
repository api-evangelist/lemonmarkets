- target: $.paths['/businesses/{business_id}/submit_document'].post
  update:
    deprecated: true
    x-deprecated-on: '2026-06-24'
    x-replacement-operation: submit_document_upload
    x-deprecation-notice: https://developer.lemon.markets/changelog/2026-06-24

