# ---- idempotency guidance on the one operation that supports it ----
- target: $.paths['/accounts/{account_id}/orders'].post
  update:
    x-idempotent: true
    x-idempotency-key-header: Idempotency-Key
    x-retry-guidance: >-
      Retry 5XX responses with exponential backoff reusing the same Idempotency-Key; the
      cached 201 is returned instead of creating a duplicate order. A replay with a changed
      payload returns 422.

