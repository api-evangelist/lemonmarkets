    x-auth-note: >-
      The published spec declares components.securitySchemes.bearerAuth but applies no
      global or per-operation security[] requirement. This overlay applies it globally so
      tooling can enforce what the documentation states.

- target: $.components.securitySchemes.bearerAuth
  update:
    description: >-
      Static partner API key sent as `Authorization: Bearer <your-api-key>`. Sandbox and
      production keys are distinct and non-interchangeable. Access is invite-only.
    x-key-issuance: invite-only, issued by lemon.markets to onboarded partners

# ---- cross-cutting conventions ----
- target: $.info
  update:
    x-conventions:
      pagination:
        style: cursor
        params: [cursor, limit]
        response_fields: [data, pagination.next_cursor]
