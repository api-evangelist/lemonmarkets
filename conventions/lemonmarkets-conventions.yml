authentication:
  style: bearer-token
  header: Authorization
  format: 'Bearer <your-api-key>'
  scheme: bearerAuth
  oauth2: false
  notes: >-
    Single HTTP bearer API key. The OpenAPI declares the bearerAuth scheme under
    components.securitySchemes but does not apply it via a global or per-operation
    security[] requirement, so the requirement is documented rather than machine-
    enforced in the spec.
  detail: authentication/lemonmarkets-authentication.yml

data_privacy_headers:
  supported: true
  required_on: 91 of 96 operations
  headers:
  - name: LMG-Data-Privacy-Access-Principal
    description: Identifies the principal (person or system) on whose behalf the data is accessed.
  - name: LMG-Data-Privacy-Access-Justification
    description: States the business justification for accessing customer data.
  notes: >-
    A lemon.markets-specific access-accountability contract. Nearly every operation that
    touches customer data requires both headers, giving a per-request audit trail of who
    accessed what and why — a GDPR/BaFin-oriented convention not commonly seen in other APIs.

idempotency:
  supported: true
  header: Idempotency-Key
  standard: draft-ietf-httpapi-idempotency-key-header
  docs: https://developer.lemon.markets/docs/idempotency
  key_format: any string, UUID recommended
  max_key_length: 100
  retention: 24h
  scope: per key + payload + endpoint
  optional: true
  supported_operations:
  - operationId: create_order
    method: POST
    path: /accounts/{account_id}/orders
  behavior:
  - scenario: first request with a new key
    outcome: processed normally, 201 response cached against the key
  - scenario: replay with same key and same payload
    outcome: cached 201 returned, no duplicate resource created
  - scenario: replay with same key but different payload
    outcome: 422 Unprocessable Content
  - scenario: replay with same key but different endpoint
    outcome: 422 Unprocessable Content
  - scenario: key exceeds 100 characters
    outcome: 422 Unprocessable Content
  - scenario: original request failed validation (400/422)
    outcome: key not consumed, may be retried with a corrected payload
  - scenario: key older than 24 hours
    outcome: cached response expired, key may be reused
  notes: >-
    Documented as designed to extend to further write operations over time; currently
    scoped to order placement. Omitting the header preserves prior (non-idempotent) behaviour.

pagination:
