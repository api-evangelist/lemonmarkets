openapi: 3.1.0
info:
  title: 'lemon.markets Brokerage API 🍋 Accounts: General Money + Positions API'
  version: 0.1.0
servers:
- url: https://sandbox.api.lemon.markets/v1
  description: Sandbox
tags:
- name: Money + Positions
paths:
  /accounts/{account_id}/withdrawals/{withdrawal_id}/confirm:
    post:
      summary: Confirm Withdrawal
      tags:
      - Money + Positions
      operationId: confirm_withdrawal
      parameters:
      - name: account_id
        required: true
        schema:
          title: Account Identifier
          type: string
        in: path
        example: cusa_20323d55bb264d42b0b225d293591049
        description: 'An account identifier.

          '
      - name: withdrawal_id
        in: path
        required: true
        schema:
          type: string
          title: Withdrawal Identifier
          description: 'A withdrawal identifier.

            '
      - name: LMG-Data-Privacy-Access-Principal
        in: header
        required: true
        schema:
          type: string
          title: Lmg-Data-Privacy-Access-Principal
      - name: LMG-Data-Privacy-Access-Justification
        in: header
        required: true
        schema:
          type: string
          title: Lmg-Data-Privacy-Access-Justification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmWithdrawalRequest'
            example: {}
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
              example:
                amount: '12.34'
                created_at: '2023-08-31T16:41:01.825087+00:00'
                currency: EUR
                history:
                - status: confirmed
                  timestamp: '2023-08-31T16:41:30.636649+00:00'
                - status: created
                  timestamp: '2023-08-31T16:41:01.825087+00:00'
                id: wtd_50d0271f9fd143adb4d6e3af8962ed4d
                receiving_account:
                  bic: COBADEFFXXX
                  iban: DE89370400440532013000
                sca:
                  challenge: idpMw_UsyU31awFi81Atyw==
                  required: false
                status: confirmed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Server Error
  /accounts/{account_id}/withdrawals:
    post:
      summary: Create Withdrawal
      tags:
      - Money + Positions
      operationId: create_withdrawal
      parameters:
      - name: account_id
        required: true
        schema:
          title: Account Identifier
          type: string
        in: path
        example: cusa_20323d55bb264d42b0b225d293591049
        description: 'An account identifier.

          '
      - name: LMG-Data-Privacy-Access-Principal
        in: header
        required: true
        schema:
          type: string
          title: Lmg-Data-Privacy-Access-Principal
      - name: LMG-Data-Privacy-Access-Justification
        in: header
        required: true
        schema:
          type: string
          title: Lmg-Data-Privacy-Access-Justification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWithdrawalRequest'
            example:
              amount: '12.34'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
              example:
                amount: '12.34'
                created_at: '2023-08-31T16:41:01.825087+00:00'
                currency: EUR
                history:
                - status: created
                  timestamp: '2023-08-31T16:41:01.825087+00:00'
                id: wtd_50d0271f9fd143adb4d6e3af8962ed4d
                receiving_account:
                  bic: COBADEFFXXX
                  iban: DE89370400440532013000
                sca:
                  challenge: idpMw_UsyU31awFi81Atyw==
                  required: false
                status: created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Server Error
    get:
      summary: List Withdrawals
      tags:
      - Money + Positions
      operationId: list_withdrawals
      parameters:
      - name: account_id
        required: true
        schema:
          title: Account Identifier
          type: string
        in: path
        example: cusa_20323d55bb264d42b0b225d293591049
        description: 'An account identifier.

          '
      - name: cursor
        required: false
        schema:
          title: Cursor
          type: string
        description: 'A pagination cursor.  When you receive a paginated response containing the property `pagination.next_cursor`, you can pass its value here to get the next page of results for your query.

          A cursor will include filter parameters, so there is not need to specify both the `cursor` and any other filter parameter.

          '
        in: query
      - name: limit
        description: 'In order to customize the number of elements returned, you can provide a limit here.  The service will not return more elements than specified.

          '
        required: false
        schema:
          title: Limit
          maximum: 100
          minimum: 1
          type: integer
          default: 100
        in: query
      - name: LMG-Data-Privacy-Access-Principal
        in: header
        required: true
        schema:
          type: string
          title: Lmg-Data-Privacy-Access-Principal
      - name: LMG-Data-Privacy-Access-Justification
        in: header
        required: true
        schema:
          type: string
          title: Lmg-Data-Privacy-Access-Justification
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodedPaginatedCollectionResponse_WithdrawalResponse_'
              example:
                data:
                - amount: '12.34'
                  created_at: '2023-08-31T16:41:01.825087+00:00'
                  currency: EUR
                  history:
                  - status: confirmed
                    timestamp: '2023-08-31T16:41:30.636649+00:00'
                  - status: created
                    timestamp: '2023-08-31T16:41:01.825087+00:00'
                  id: wtd_50d0271f9fd143adb4d6e3af8962ed4d
                  receiving_account:
                    bic: COBADEFFXXX
                    iban: DE89370400440532013000
                  sca:
                    challenge: idpMw_UsyU31awFi81Atyw==
                    required: true
                  status: confirmed
                pagination:
                  next_cursor: null
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Server Error
