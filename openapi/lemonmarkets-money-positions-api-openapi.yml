      title: TransactionComponentDirection
      description: 'A category representing a component direction:

        <ul> <li><code>credit</code>: Assets for the customer.  The amount/quanity will be added to the balance/position. <li><code>debit</code>: Liabilities for the customer.  The amount/quantity will be subtracted from the balance/position. </ul>

        '
    StatusChange_WithdrawalStatus_:
      properties:
        status:
          $ref: '#/components/schemas/WithdrawalStatus'
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: 'The timestamp of the event.  It represents the point in time at which the withdrawal was updated.

            '
          example: '2023-06-23T07:29:55.465000+00:00'
      type: object
      required:
      - status
      - timestamp
      title: StatusChange[WithdrawalStatus]
    SecuritiesComponent:
      title: Securities Component
      description: 'An object representing an instrument-related component of a transaction.

        '
      properties:
        type:
          $ref: '#/components/schemas/TransactionComponentType'
        direction:
          $ref: '#/components/schemas/TransactionComponentDirection'
        instrument:
          type: string
          pattern: ^[A-Z]{2}[0-9A-Z]{9}[0-9]$
          title: Instrument
          description: 'An ISIN (International Securities Identification Number) according to ISO 6166. This value uniquely identifies the instrument of this component.

            '
        quantity:
          type: number
          exclusiveMinimum: 0
          title: Quantity
          description: 'The number of shares affected by this component.

            '
      type: object
      required:
      - type
      - direction
      - instrument
      - quantity
    PositionsResponse:
      title: PositionsResponse
      description: 'A position of the portfolio.  Each of these items represents an instrument for which the user owns shares at the moment.

        '
      required:
      - buy_in
      - currency
      - instrument
      - latest_bid
      - latest_price
      - quantity
      type: object
      properties:
        buy_in:
          title: Buy In
          type: string
          format: number
          description: 'The buy-in for this instrument. This is the average price paid for each share. Buying and selling shares will influence this value.

            '
        currency:
          title: Currency
          maxLength: 3
          minLength: 3
          type: string
          description: 'An ISO 4217 three-letter currency code. Its value represents the currency for prices of the instrument listed here. The only currently available currency is `"EUR"`.

            '
        instrument:
          $ref: '#/components/schemas/Instrument'
        latest_bid:
          title: Latest Bid
          type: string
          format: number
          description: 'The latest bid.  This is a price indication that can be used to determine the profit/loss on a specific position.

            '
        latest_price:
          $ref: '#/components/schemas/LatestPrice'
        quantity:
          title: Quantity
          exclusiveMinimum: 0
          type: string
          format: number
          description: 'The number of shares owned for a specific instrument.

            '
      example:
        instrument:
          isin: IE00B441G979
          title: iShares MSCI World EUR Hedged UCITS ETF (Acc)
        quantity: '232.75210'
        buy_in: '71.8482'
        latest_bid: '71.7580'
        latest_price:
          amount: '71.7580'
          type: quote
          updated_at: '2026-04-23T10:30:00+00:00'
        currency: EUR
    PriceType:
      type: string
      enum:
      - nav
      - quote
      title: PriceType
      description: 'A category representing the source of a price:

        <ul> <li><code>nav</code>:  The price indicates the most recent net asset value (NAV) per share. <li><code>quote</code>:  The price indicates the most recent market quote (bid side) for a share. </ul>

        '
    QuoteLatestPrice:
      type: object
      title: Quote Latest Price
      description: 'The latest market quote price for an instrument.

        '
      properties:
        amount:
          type: string
          title: Amount
          description: 'The latest price for a security.  Use the instrument''s `currency` to interpret this value.

            '
        type:
          $ref: '#/components/schemas/PriceType'
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: 'The timestamp when the quote price was last updated.

            '
      required:
      - amount
      - type
      - updated_at
    StatusChange_SweepStatus_:
      properties:
        status:
          $ref: '#/components/schemas/SweepStatus'
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: 'The timestamp of the event.  It represents the point in time at which the sweep was updated.

            '
          example: '2023-06-23T07:29:55.465000+00:00'
      type: object
      required:
      - status
      - timestamp
      title: StatusChange[SweepStatus]
    BankAccountResponse:
      title: BankAccountResponse
      description: 'An object representing a bank account.

        '
      required:
      - iban
      - bic
      type: object
      properties:
        iban:
          title: IBAN
          type: string
          description: 'An IBAN (International Bank Account Number) according to ISO 13616-1:2020.

            '
        bic:
          title: BIC
          type: string
          description: 'A BIC (Business Identifier Code) according to ISO 9362.

            '
        name:
          type: string
          title: Name
          description: 'The name of the bank managing the bank account.

            '
    SweepStatus:
      type: string
      enum:
      - canceled
      - created
      - processed
      - rejected
      - started
      title: SweepStatus
      description: 'A category describing the status of a balance sweep:

        <ul> <li><code>canceled</code> <li><code>created</code> <li><code>processed</code> <li><code>rejected</code> <li><code>started</code> </ul>

        '
    EncodedPaginatedCollectionResponse_PositionsResponse_:
      title: Page of PositionsResponse
      required:
      - data
      - pagination
      type: object
      properties:
        data:
          title: Data
          description: 'The elements of the response.

            '
          type: array
          items:
            $ref: '#/components/schemas/PositionsResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
    EncodedPaginationResponse:
      type: object
      title: EncodedPaginationResponse
      properties:
        next_cursor:
          type: string
          title: Next Cursor
          description: 'When fetching long lists of elements, you can use our pagination feature to fetch batches of data.  If a response contains the property `pagination.next_cursor`, you can pass its value via the query item `cursor` to generate the request for the next batch of data.

            '
      description: 'Information about accessing elements beyond the ones that were returned.

        '
      example:
        next_cursor: <opaque-data>
    WithdrawalResponse:
      properties:
        id:
          type: string
          title: Identifier
          description: 'A string representing the unique identifier of this transaction.

            '
        status:
          $ref: '#/components/schemas/WithdrawalStatus'
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0
          - type: string
          title: Amount
          description: 'The amount of money to withdraw.

            '
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
          example: EUR
          description: 'An ISO 4217 three-letter currency code. Its value represents the currency for the amount listed here. The only currently available currency is `"EUR"`.

            '
        receiving_account:
          $ref: '#/components/schemas/BankAccountResponse'
        sca:
          $ref: '#/components/schemas/StrongCustomerAuthenticationRequest'
        history:
          items:
            $ref: '#/components/schemas/StatusChange_WithdrawalStatus_'
          type: array
          title: History
          description: 'A history of the status changes for a withdrawal.

            '
        created_at:
          type: string
          format: date-time
          title: Created At
          description: 'The timestamp of the withdrawal.  It represents the point in time at which the withdrawal was created.

            **NOTE:**  Deprecated as of 2024-06, use `history` to query this information.

            '
      type: object
      required:
      - id
      - status
      - amount
      - currency
      - receiving_account
      - history
      title: WithdrawalResponse
    LatestPrice:
      title: Latest Price
      description: 'An object representing the latest price for an instrument.

        '
      anyOf:
      - $ref: '#/components/schemas/QuoteLatestPrice'
      - $ref: '#/components/schemas/NavLatestPrice'
      discriminator:
        propertyName: type
        mapping:
          quote: '#/components/schemas/QuoteLatestPrice'
          nav: '#/components/schemas/NavLatestPrice'
    ConfirmWithdrawalRequest:
      properties:
        sca:
          $ref: '#/components/schemas/SCAConfirmation'
      type: object
      title: ConfirmWithdrawalRequest
    CreateWithdrawalRequest:
      properties:
        amount:
          type: string
          exclusiveMinimum: 0
          format: number
          title: Amount
          description: 'The amount of money to withdraw.

            '
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
          default: EUR
          example: EUR
          description: 'An ISO 4217 three-letter currency code. Its value represents the currency for the amount listed here. The only currently available currency is `"EUR"`.

            '
      type: object
      required:
      - amount
      title: CreateWithdrawalRequest
    SCAConfirmation:
      title: Strong Customer Authentication
      description: 'An object representing the confirmation for strong customer authentication.

        '
      properties:
        client_credential_id:
          type: string
          title: Client Credential Identifier
          description: 'The client-side identifier of the authenticator used to generate the signature.

            '
        signature:
          type: string
          title: Signature
          description: 'The base64-url encoded DER form of the signature for `challenge` using the private key for the public key that was registered as an authenticator.

            '
      type: object
      required:
      - client_credential_id
      - signature
    ErrorResponse:
      title: ErrorResponse
      required:
      - message
      type: object
      properties:
        message:
          title: Message
          type: string
    StatusChange_TransactionStatus_:
      title: StatusChange of TransactionStatus
      properties:
        status:
          $ref: '#/components/schemas/TransactionStatus'
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: 'The timestamp of the event.  It represents the point in time at which the transaction was updated.

            '
          example: '2023-06-23T07:29:55.465000+00:00'
      type: object
      required:
      - status
      - timestamp
    TransactionType:
      type: string
      enum:
      - deposit
      - income_distribution
      - securities_transfer
      - sweep
      - tax
      - trade
      - withdrawal
      title: TransactionType
      description: 'A category representing a transaction type:

        <ul> <li><code>deposit</code>: Cash Deposit <li><code>income_distribution</code>: Income Distribution <li><code>securities_transfer</code>: Securities Transfer <li><code>sweep</code>: Balance Sweep <li><code>tax</code>: Tax Payment <!--or Credit--> <li><code>trade</code>: Trade <li><code>withdrawal</code>: Cash Withdrawal </ul>

        '
    CustomerAccountFinancialsResponse:
      title: CustomerAccountFinancialsResponse
      required:
      - balance
      - buying_power
      - funds_to_withdraw
      - blocked
      - to_be_settled
      - currency
      type: object
      properties:
        balance:
          title: Balance
          type: string
          format: number
          description: 'The current balance on the user''s cash account.

            '
        buying_power:
          title: Buying Power
          type: string
          format: number
          description: 'The amount of money available to the user for buying instruments.

            '
        funds_to_withdraw:
          title: Funds To Withdraw
          type: string
          format: number
          description: 'The amount of money available for withdrawal. As trades are usually settled within two business days, this might not include proceeds from sales within the last few days (those will be `to_be_settled` until they are available).

            '
        blocked:
          title: Blocked
          type: string
          format: number
          description: 'Amount blocked for orders placed, but not executed yet.

            '
        to_be_settled:
          title: To be Settled
          type: string
          format: number
          description: 'Incoming funds not settled yet. Within the next few business days, those will be moved from `to_be_settled` to `balance` and `funds_to_withdraw`.

            '
        currency:
          title: Currency
          maxLength: 3
          minLength: 3
          type: string
          example: EUR
          description: 'An ISO 4217 three-letter currency code. Its value represents the currency for amounts listed here. The only currently available currency is `"EUR"`.

            '
    Page_SweepResponse_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/SweepResponse'
          type: array
          title: Data
          description: 'The elements of the response.

            '
        pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
      required:
      - data
      - pagination
      title: Page[SweepResponse]
    TransactionComponent:
      title: Transaction Component
      description: 'A component of a transaction.  It indicates changes to the positions or funds affected by a transaction.

        '
      anyOf:
      - $ref: '#/components/schemas/CashComponent'
      - $ref: '#/components/schemas/SecuritiesComponent'
      discriminator:
        propertyName: type
        mapping:
          cash: '#/components/schemas/CashComponent'
          securities: '#/components/schemas/SecuritiesComponent'
    TransactionComponentType:
      type: string
      enum:
      - cash
      - securities
      title: TransactionComponentType
      description: 'A category representing a component type:

        <ul> <li><code>cash</code>: Cash component; this component modifies the customer''s cash balance. <li><code>securities</code>: Securities component; this component modified a customer''s position. </ul>

        '
    Instrument:
      title: Instrument
      description: A summary of the instrument references in a position.
      required:
      - isin
      - title
      type: object
      properties:
        isin:
          title: ISIN
          type: string
          description: 'An ISIN (International Securities Identification Number) according to ISO 6166. This value uniquely identifies the instrument of this position.

            '
        title:
          title: Title
          type: string
          description: 'The title of the instrument.

            '
      example:
        isin: LU1437015735
        title: Amundi Index MSCI Europe UCITS ETF DR
    StrongCustomerAuthenticationRequest:
      title: StrongCustomerAuthenticationRequest
      description: 'An object representing a strong customer authentication challenge.

        '
      properties:
        required:
          type: boolean
          title: Required
          description: 'Indication of strong customer authentication requirement.  If this value is `true`, the next request needs to include a solution to the challege (e.g. in the `sca` property for batch order confirmation).

            '
        challenge:
          type: string
          title: Challenge
          description: 'A base64-url encoded blob of data.  Sign the decoded data using a registered authenticator and include the signature in the next request (e.g. in the `sca` property for batch order confirmation).

            '
      type: object
      required:
      - required
      - challenge
    NavLatestPrice:
      type: object
      title: NAV Latest Price
      description: 'The latest NAV (Net Asset Value) price for an instrument.

        '
      properties:
        amount:
          type: string
          title: Amount
          description: 'The latest price for a security.  Use the instrument''s `currency` to interpret this value.

            '
        type:
          $ref: '#/components/schemas/PriceType'
        valuation_date:
          type: string
          format: date
          title: Valuation Date
          description: 'The date for which the NAV (Net Asset Value) price is valid.

            '
      required:
      - amount
      - type
      - valuation_date
    CashComponent:
      title: Cash Component
      description: 'An object representing the cash component of a transaction.

        '
      properties:
        type:
          $ref: '#/components/schemas/TransactionComponentType'
        direction:
          $ref: '#/components/schemas/TransactionComponentDirection'
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
          example: EUR
          description: 'An ISO 4217 three-letter currency code. Its value represents the currency for the amount listed. The only currently available currency is `"EUR"`.

            '
        amount:
          type: number
          title: Amount
          description: 'The amount of cash being moved in this transaction component.

            '
      type: object
      required:
      - type
      - direction
      - currency
      - amount
    WithdrawalStatus:
      type: string
      enum:
      - accepted
      - canceled
      - confirmed
      - created
      - processed
      - rejected
      title: Withdrawal Status
      description: 'A category representing a withdrawal''s status:

        <ul> <li><code>accepted</code> <li><code>canceled</code> <li><code>confirmed</code> <li><code>created</code> <li><code>processed</code> <li><code>rejected</code> </ul>

        '
    Page_Transaction_:
      title: Page of Transaction
      properties:
        data:
          title: Data
          description: 'The elements of the response.

            '
          items:
            $ref: '#/components/schemas/Transaction'
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
      required:
      - data
      - pagination
    Transaction:
      properties:
        id:
          type: string
          title: Identifier
          description: 'A string representing the unique identifier of this transaction.

            '
        status:
          $ref: '#/components/schemas/TransactionStatus'
        type:
          $ref: '#/components/schemas/TransactionType'
        source:
          type: string
          title: Source
          description: 'An opaque identifier referencing the source of the transaction.

            '
        components:
          items:
            $ref: '#/components/schemas/TransactionComponent'
          type: array
          title: Components
        history:
          items:
            $ref: '#/components/schemas/StatusChange_TransactionStatus_'
          type: array
          title: History
          description: 'A history of the status changes for a transaction.

            '
      type: object
      required:
      - id
      - status
      - type
      - source
      - components
      - history
      title: Transaction
    EncodedPaginatedCollectionResponse_WithdrawalResponse_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/WithdrawalResponse'
          type: array
          title: Data
          description: 'The elements of the response.

            '
        pagination:
          $ref: '#/components/schemas/EncodedPaginationResponse'
      type: object
      required:
      - data
      - pagination
      title: Page[WithdrawalResponse]
    TransactionStatus:
      type: string
      enum:
      - canceled
      - created
      - settled
      title: TransactionStatus
      description: 'A category representing a transaction status:

        <ul> <li><code>canceled</code>: The transaction was canceled. <li><code>created</code>: The transaction was created and is not settled yet. <li><code>settled</code>: The transaction is settled. </ul>

        '
    SweepResponse:
      properties:
        id:
          type: string
          title: Identifier
          description: 'A unique value identifying this sweep.

            '
        status:
          $ref: '#/components/schemas/SweepStatus'
        amount:
          type: string
          title: Amount
          description: 'The amount of money to be withdrawn during the balance sweep.

            '
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
          description: 'An ISO 4217 three-letter currency code. Its value represents the currency for the amount listed here. The only currently available currency is `"EUR"`.

            '
        history:
          items:
            $ref: '#/components/schemas/StatusChange_SweepStatus_'
          type: array
          title: History
      type: object
      required:
      - id
      - status
      - amount
      - currency
      - history
      title: SweepResponse
    Pagination:
      title: Pagination
      type: object
      properties:
        next_cursor:
          title: Cursor for Next Page
          type: string
          description: 'When fetching long lists of elements, you can use our pagination feature to fetch batches of data.  If a response contains the property `pagination.next_cursor`, you can pass its value via the query item `cursor` to generate the request for the next batch of data.

            '
      description: 'Information about accessing elements beyond the ones that were returned.

        '
      example:
        next_cursor: <opaque-data>
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
