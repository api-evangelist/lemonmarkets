openapi: 3.1.0
info:
  title: 'lemon.markets Brokerage API 🍋 Accounts: General Businesses API'
  version: 0.1.0
servers:
- url: https://sandbox.api.lemon.markets/v1
  description: Sandbox
tags:
- name: Businesses
paths:
  /businesses/{business_id}/beneficial_owners:
