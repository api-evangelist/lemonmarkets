    GermanBusinessLegalForm:
      title: GermanBusinessLegalForm
      type: string
      enum:
      - gmbh
      - ug
      description: 'A category representing the formal type of a German legal entity:

        <ul> <li><code>gmbh</code>: GmbH <li><code>ug</code>: UG (haftungsbeschränkt) </ul>

        '
    RepresentationRule:
      type: string
      enum:
      - sole_representation
      - joint_representation
      title: RepresentationRule
      description: 'A category describing the representation rule for a legal representative:

        <ul> <li><code>sole_representation</code>:  The legal representative alone can represent the company. <li><code>joint_representation</code>:  The legal representative needs at least one more legal representative to represent the company. </ul>

        '
    BusinessRegistrationResponse:
      type: object
      title: BusinessRegistrationResponse
      description: 'Business registration information as returned in API responses.

        '
      discriminator:
        propertyName: incorporation_country
        mapping:
          DE: '#/components/schemas/GermanBusinessRegistration'
          '*': '#/components/schemas/GenericBusinessRegistrationResponse'
      anyOf:
      - $ref: '#/components/schemas/GermanBusinessRegistration'
      - $ref: '#/components/schemas/GenericBusinessRegistrationResponse'
