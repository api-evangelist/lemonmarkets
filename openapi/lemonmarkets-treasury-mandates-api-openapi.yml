    WidgetStyling:
      description: 'Optional styling configuration for the treasury mandate widget. All fields are optional and allow customization of the widget''s appearance to match your application''s design.

        '
      properties:
        background_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          title: Background Color
          description: 'The background color of the widget in hex format (e.g., <code>#FFFFFF</code>). Defaults to <code>#f9f9f9</code>.

            '
        text_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          title: Text Color
          description: 'The color of the text in the widget in hex format (e.g., <code>#000000</code>). Defaults to <code>#444444</code>.

            '
        text_size:
          type: string
          pattern: ^\d+(\.\d+)?px$
          title: Text Size
          description: 'The size of the text in pixel format (e.g., <code>16px</code>). Defaults to <code>16px</code>.

            '
        text_line_height:
          type: string
          pattern: ^\d+(\.\d+)?$
          title: Text Line Height
          description: 'The line height of the text as a numeric value (e.g., <code>1.5</code>). Defaults to <code>1.75</code>.

            '
        logo_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          title: Logo Color
          description: 'The color of the lemon.markets logo in the footer in hex format (e.g., <code>#000000</code>). When provided, this overrides the logo with a monochrome version in your specified color. Otherwise, it defaults to the standard lemon.markets logo colors.

            '
        button_text_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          title: Button Text Color
          description: 'The color of the button text in hex format (e.g., <code>#FFFFFF</code>). Defaults to <code>#ffffff</code> (white).

            '
        button_background_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          title: Button Background Color
