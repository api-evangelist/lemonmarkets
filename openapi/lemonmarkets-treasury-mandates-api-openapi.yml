          title: Portfolio Balance
          description: 'The current portfolio balance.  This is the number you want to display as the balance to your customers

            '
        available_balance:
          type: string
          format: number
          title: Available Balance
          description: 'The available portfolio balance for withdrawals

            '
        unsettled_deposits:
          type: string
          format: number
          title: Unsettled Deposits
          description: 'The value of deposits that are not fully processed yet.  Once fully processed, the deposits will be considered in `portfolio_balance`.

            '
        unsettled_withdrawals:
          type: string
