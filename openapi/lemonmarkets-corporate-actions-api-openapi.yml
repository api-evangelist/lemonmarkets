      - currency
      title: IncomeDistributionResponse
    CorporateActionType:
      type: string
      enum:
      - cash_dividend
      - income_distribution
      title: CorporateActionType
      description: 'A category representing the type of corporate action:

        <ul> <li><code>cash_dividend</code>: A cash dividend paid out to shareholders. <li><code>income_distribution</code>: An income or capital distribution from a fund or ETF. </ul>

