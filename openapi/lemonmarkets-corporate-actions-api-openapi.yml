components:
  schemas:
    EncodedPaginationResponse:
      type: object
      title: EncodedPaginationResponse
      properties:
        next_cursor:
          type: string
          title: Next Cursor
          description: 'When fetching long lists of elements, you can use our pagination feature to fetch batches of data.  If a response contains the property `pagination.next_cursor`, you can pass its value via the query item `cursor` to generate the request for the next batch of data.

            '
      description: 'Information about accessing elements beyond the ones that were returned.

        '
      example:
        next_cursor: <opaque-data>
    CorporateActionCashDividendResponse:
      title: CorporateActionCashDividendResponse
      description: 'A cash dividend corporate action. Represents a dividend payment to a customer account for shares held at the ex-date.

        '
      properties:
        id:
          type: string
          title: Identifier
          description: 'The identifier referring to this corporate action for the customer account.

            '
        securities_account:
          type: string
          title: Securities Account Identifier
          description: 'The securities account identifier associated with this corporate action.

            '
        instrument:
          type: string
          title: Instrument
          description: 'An ISIN (International Securities Identification Number) according to ISO 6166. This value identifies the instrument that paid the dividend.

            '
        type:
          const: cash_dividend
          title: Type
          description: 'The string `"cash_dividend"`, identifying this type of corporate action.

            '
        ex_date:
          type: string
          format: date
          title: Ex-Date
          description: 'The first day the security trades without the dividend. Shares must be purchased before this date to be eligible for the dividend payment.

            '
        record_date:
          type: string
          format: date
          title: Record Date
          description: 'The date lemon.markets checks who is on the shareholder register for dividend eligibility.

            '
        payable_date:
          type: string
          format: date
          title: Payable Date
          description: 'The date the dividend is actually paid out. Due to the number of parties involved, it is common for payment to arrive a few business days after this date.

            '
        amount_per_share:
          type: string
          title: Amount Per Share
          description: 'The gross dividend amount per share, represented as a decimal string.

            '
        amount_per_share_currency:
          type: string
          title: Amount Per Share Currency
          example: EUR
          description: 'An ISO 4217 three-letter currency code representing the currency of the `amount_per_share` value.

            '
        amount:
          type: string
          title: Amount
          description: 'The total gross dividend amount (before taxes), represented as a decimal string.

            '
        currency:
          type: string
          title: Currency
          example: EUR
          description: 'An ISO 4217 three-letter currency code. Represents the currency for `amount` and `taxes`. The only currently available currency is `"EUR"`.

            '
        shares_on_ex_date:
          type: string
          title: Shares on Ex-Date
          description: 'The number of shares held at the ex-date cutoff, represented as a decimal string with up to 5 decimal places. This is the quantity used to calculate the total dividend amount.

            '
        taxes:
          items:
            $ref: '#/components/schemas/TaxResponseField'
          type: array
          title: Taxes
          description: 'A list of taxes withheld from this dividend payment.

            '
      type: object
      required:
      - id
      - securities_account
      - instrument
      - type
      - ex_date
      - record_date
      - payable_date
      - amount_per_share
      - amount_per_share_currency
      - amount
      - currency
      - shares_on_ex_date
      - taxes
    CorporateActionIncomeDistributionResponse:
      title: CorporateActionIncomeDistributionResponse
      description: 'An income distribution corporate action. Represents a distribution from a fund or ETF to a customer account.

        '
      properties:
        id:
          type: string
          title: Identifier
          description: 'The identifier referring to this corporate action for the customer account.

            '
        securities_account:
          type: string
          title: Securities Account Identifier
          description: 'The securities account identifier associated with this corporate action.

            '
        instrument:
          type: string
          title: Instrument
          description: 'An ISIN (International Securities Identification Number) according to ISO 6166. This value identifies the instrument that made the distribution.

            '
        type:
          const: income_distribution
          title: Type
          description: 'The string `"income_distribution"`, identifying this type of corporate action.

            '
        direction:
          $ref: '#/components/schemas/Direction'
        payable_date:
          type: string
          format: date
          title: Payable Date
          description: 'The date the distribution is actually paid out. Due to the number of parties involved, it is common for payment to arrive a few business days after this date.

            '
        amount:
          type: string
          title: Amount
          description: 'The total gross distribution amount (before taxes), represented as a decimal string.

            '
        currency:
          type: string
          title: Currency
          example: EUR
          description: 'An ISO 4217 three-letter currency code. Represents the currency for `amount` and `taxes`. The only currently available currency is `"EUR"`.

            '
        taxes:
          items:
            $ref: '#/components/schemas/TaxResponseField'
          type: array
          title: Taxes
          description: 'A list of taxes withheld from this distribution.

            '
      type: object
      required:
      - id
      - securities_account
      - instrument
      - type
      - direction
      - payable_date
      - amount
      - currency
      - taxes
    CorporateActionResponseUnion:
      title: Corporate Action
      description: 'An object representing a corporate action that affected a customer account. The response is polymorphic, discriminated by the `type` property.

        '
      oneOf:
      - $ref: '#/components/schemas/CorporateActionCashDividendResponse'
      - $ref: '#/components/schemas/CorporateActionIncomeDistributionResponse'
      discriminator:
        propertyName: type
        mapping:
          cash_dividend: '#/components/schemas/CorporateActionCashDividendResponse'
          income_distribution: '#/components/schemas/CorporateActionIncomeDistributionResponse'
    TaxResponseField:
      properties:
        type:
          type: string
          title: Type
          description: 'A string identifying the type of tax that was withheld for a trade:

            <ul> <li><code>capital_gains</code> <li><code>church_tax</code> <li><code>solidarity_surcharge</code> </ul>

            <strong>NOTE:</strong> This list can be extended in the future.  Prepare your code to accept other values, too.

            '
        amount:
          type: string
          title: Amount
          description: 'The monetary amount representing this tax.

