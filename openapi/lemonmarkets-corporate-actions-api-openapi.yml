      description: 'The status of a corporate action:

        <ul> <li><code>created</code>: The corporate action has been created and is pending processing. <li><code>processed</code>: The corporate action has been fully processed. </ul>

        '
    InstrumentLevelIncomeDistributionResponse:
      title: InstrumentLevelIncomeDistributionResponse
      description: 'An income distribution corporate action at the instrument level. Represents a distribution from a fund or ETF, including daily factors used for calculation.

        '
