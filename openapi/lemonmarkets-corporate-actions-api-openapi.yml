      type: object
      required:
      - data
      - pagination
      title: EncodedPaginatedCollectionResponse[IncomeDistributionResponse]
    StatusChange_CorporateActionStatus_:
      title: StatusChange[CorporateActionStatus]
      description: 'An object representing a status change of a corporate action.

        '
      properties:
