      type: object
      properties:
        message:
          title: Message
          type: string
    EncodedPaginatedCollectionResponse_InstrumentLevelCorporateActionResponseUnion_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/InstrumentLevelCorporateActionResponseUnion'
