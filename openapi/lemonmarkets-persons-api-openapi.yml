      title: EncodedPaginatedCollectionResponse[PersonResponse]
    PersonDataUpdateRegisteredAddressRequest:
      title: PersonDataUpdateRegisteredAddressRequest
      description: 'A request to update a person''s registered address.

        '
      required:
      - type
      - line_1
      - postal_code
      - city
      - country
      type: object
      properties:
        type:
          type: string
          const: registered_address
          title: Type
          description: 'The type discriminator identifying this as a registered address update request.

            '
        line_1:
          type: string
          maxLength: 255
          title: Address Line 1
          description: 'The first line of the address, typically containing the street name and number.

            '
          example: Neue Straße 1
        line_2:
          type: string
          maxLength: 255
          nullable: true
          title: Address Line 2
          description: 'An optional second line of the address, for additional address details.

            '
        postal_code:
          type: string
          maxLength: 20
          title: Postal Code
          description: 'The postal code or ZIP code of the address.

            '
          example: '10115'
        city:
          type: string
          maxLength: 255
          title: City
          description: 'The city or municipality of the address.

            '
          example: Berlin
        country:
          type: string
          maxLength: 2
          minLength: 2
          title: Country
          description: 'An ISO 3166-1 alpha-2 code representing the country of the address.

            '
          example: DE
    PersonDataUpdateAnnotatedResponse:
      title: PersonDataUpdateAnnotatedResponse
      description: 'An object representing a person data update request with the specific data being updated.

        '
      type: object
      required:
      - id
      - type
      - history
      properties:
        id:
          type: string
          title: Update Identifier
          description: 'A unique identifier for the person data update request.

            '
          example: upd_4ffa7b6928e6466ba8c13badb49f8add
        type:
          type: string
          title: Type
          description: 'The discriminator identifying which field is being updated.

            '
          enum:
          - email
          - phone_number
          - registered_address
          - employment
          - tax_residencies
        email:
          type: string
          format: email
          title: Email
          description: 'The new email address for the person when `type` is `email`.

            '
          example: newemail@example.com
        number:
          type: string
          minLength: 1
          maxLength: 45
          title: Phone Number
          description: 'The new phone number for the person, including the country calling code, when `type` is `phone_number`.

            '
          example: '+49172997319'
        line_1:
          type: string
          maxLength: 255
          title: Address Line 1
          description: 'The first line of the address when `type` is `registered_address`.

            '
          example: Neue Straße 1
        line_2:
          type: string
          maxLength: 255
          nullable: true
          title: Address Line 2
          description: 'An optional second line of the address when `type` is `registered_address`.

            '
        postal_code:
          type: string
          maxLength: 20
          title: Postal Code
          description: 'The postal code or ZIP code of the address when `type` is `registered_address`.

            '
          example: '10115'
        city:
          type: string
          maxLength: 255
          title: City
          description: 'The city or municipality of the address when `type` is `registered_address`.

            '
          example: Berlin
        country:
          type: string
          maxLength: 2
          minLength: 2
          title: Country
          description: 'An ISO 3166-1 alpha-2 code representing the country when `type` is `registered_address`.

            '
          example: DE
        status:
          $ref: '#/components/schemas/EmploymentStatus'
          description: 'The employment status when `type` is `employment`.

            '
        annual_salary:
          $ref: '#/components/schemas/AnnualSalary'
          description: 'The annual salary range when `type` is `employment`.

            '
        sector:
          $ref: '#/components/schemas/IndustrySector'
          description: 'The employment sector when `type` is `employment`.

            '
        residencies:
          title: Tax Residencies
          type: array
          description: 'The list of tax residencies and TINs when `type` is `tax_residencies`.

            '
          items:
            $ref: '#/components/schemas/PersonDataUpdateTaxResidency'
        history:
          type: array
          title: History
          description: 'A chronological list of status changes for this update request.

            '
          items:
            $ref: '#/components/schemas/StatusChange_PersonDataUpdateRequestStatus_'
    PersonRequest:
      properties:
        firstname:
          type: string
          maxLength: 100
          minLength: 1
          title: First Name
          example: Erika
          description: 'A string describing the person''s first name.

            '
        lastname:
          type: string
          maxLength: 100
          minLength: 1
          title: Lastname
          example: Mustermann
          description: 'A string describing the person''s lastname.

            '
        date_of_birth:
          type: string
          format: date
          title: Date Of Birth
          description: 'A string describing the day of birth, like `"1964-08-13"`.

            '
          example: '1964-08-13'
        registered_address:
          $ref: '#/components/schemas/AddressRequest'
        nationalities:
          items:
            type: string
            maxLength: 2
            minLength: 2
          type: array
          minItems: 1
          title: Nationalities
          description: 'A **complete** list of ISO 3166-1 alpha-2 codes, representing each country related to a user''s nationalities/citizenships.  It is important for this data point to be complete.

            '
          example:
          - DE
        email:
          type: string
          format: email
          title: Email
          description: 'A verified email address to contact the user.  This email address must match the one you have on record for the user.

            '
          example: erika.mustermann@example.com
        phone_number:
          type: string
          maxLength: 45
          minLength: 1
          title: Mobile Phone Number
          description: 'A mobile phone number, including the country calling code.

            '
          example: '+49172997318'
        place_of_birth:
          $ref: '#/components/schemas/BusinessPersonPlaceOfBirthRequest'
        tax_residencies:
          items:
            $ref: '#/components/schemas/TaxResidency'
          type: array
          minItems: 1
          title: Tax Residencies
          description: 'A list of a person''s tax residencies.  It is important for this data point to be complete.

            '
        accepted_agreements:
          title: Accepted Agreements
          description: 'A list of legal agreements that have been accepted by the person.

            '
          items:
            $ref: '#/components/schemas/broker__apps__api__endpoints__agreements__AgreementAcceptanceRequest'
          type: array
          maxItems: 1
          minItems: 1
      type: object
      required:
      - firstname
      - lastname
      - date_of_birth
      - registered_address
      - accepted_agreements
      title: PersonRequest
    PersonDataUpdateEmailRequest:
      title: PersonDataUpdateEmailRequest
