components:
  schemas:
    AppropriatenessConsentResponse:
      title: AppropriatenessConsentResponse
      description: 'An object representing the requirements for explicit confirmation of an appropriateness warning.

        '
      type: object
      properties:
        required:
          type: boolean
          title: Consent Required
          description: 'Requirement indicator for the appropriateness warning.

            **NOTE:** If this value is `true`, the frontend must present a warning to the user as outlined in your onboarding documentation.

            '
      required:
      - required
    ActionDataResponse:
      properties:
        type:
          $ref: '#/components/schemas/ActionType'
        order:
          $ref: '#/components/schemas/OrderDataResponse'
      type: object
      required:
      - type
      - order
      description: 'An object representing a workflow action.

        '
      title: ActionDataResponse
    Page_CustomerWorkflowResponse_:
      title: Page of CustomerWorkflowResponse
      required:
      - data
      - pagination
      type: object
      properties:
        data:
          title: Data
          description: 'The elements of the response.

            '
          type: array
          items:
            $ref: '#/components/schemas/CustomerWorkflowResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CustomerWorkflowStatus:
      type: string
      enum:
      - canceled
      - confirmed
      - created
      title: CustomerWorkflowStatus
      description: 'A category representing a workflow status:

        <ul> <li><code>canceled</code> <li><code>confirmed</code> <li><code>created</code> </ul>

        '
