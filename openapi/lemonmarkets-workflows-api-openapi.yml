      description: 'A category describing the cadence for scheduled workflows:

        <ul> <li><code>daily</code>: Execute every Trading Day (Sandbox-only) <li><code>monthly</code>: Execute once every Month, on the first trading day </ul>

        '
    TriggerRequest:
      properties:
        type:
          $ref: '#/components/schemas/TriggerType'
