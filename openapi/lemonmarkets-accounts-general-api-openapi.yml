          type: string
          example: agr_9902271f791d413aad781763c61b9bb0
          description: 'An agreement identifier. This value identifies the agreement that a customer has accepted at a certain point in time.

            '
        accepted_at:
          title: Accepted At
          type: string
          format: date-time
          example: '2023-06-29T14:39:29Z'
          description: 'A point in time.  This value specifies the point in time at which the user accepted the agreement referenced by `agreement_id`.

            '
        legal_representative:
          type: string
          title: Legal Representative
          maxLength: 255
          example: le_3a0baf04657b4fb9bcaa03d8120b5e9e
          description: 'An legal representative identifier.  This value identifies the legal representative who has accepted the agreement.

            '
    Pagination:
