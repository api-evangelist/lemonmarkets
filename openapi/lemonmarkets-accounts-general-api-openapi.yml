components:
  schemas:
    AuthenticatorResponse:
      properties:
        id:
          type: string
          title: Authenticator Identifier
          description: 'An authenticator identifier.

            '
        created_at:
          type: string
          format: date-time
          title: Created At
          description: 'A timestamp representing the point in time when the authenticator was registered.

            '
        public_key:
          type: string
          title: Public Key
          description: 'The base64-url encoded form of the authenticator''s public key.  See the guide on strong customer authentication for more information about the format.

            '
        client_credential_id:
          type: string
          title: Client Credential Identifier
          description: 'A client-side (read: on-device) identifier for the public key of the authenticator.  Use this identifier to indicate the private key used to create a signature in the two-step verification process or to match the authenticator in a list of authenticated devices.

            **NOTE:** All authenticators associated with a single account must have different values in `client_credential_id`.

            '
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - created_at
      - public_key
      - client_credential_id
      - name
      title: AuthenticatorResponse
      example:
        client_credential_id: adfd5154-c39c-41c5-a88d-f3e6a2aded9e
        created_at: '2023-07-28T14:10:33.858446+00:00'
        id: sca_8f993645e0954d8ab35198c4c7875fcd
        name: Happy 🍋
        public_key: pSJYIO1qxZIy0bSkO0djjJtdFFVU5K0v1l76XJQba8DNw3xXAQIgAQMmIVggh3uzl_vqfplJX8P3T-rdhEbkO_XX5dDkuGjFO0kRr5w=
    StatusChange_OnboardingCheckStatus_:
      title: StatusChange of OnboardingCheckStatus
      required:
      - status
      - timestamp
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CustomerAccountCheckStatus'
        timestamp:
          title: Timestamp
          type: string
          format: date-time
          description: 'The timestamp of the event.  It represents the point in time at which the account check was updated.

            '
          example: '2023-06-23T07:29:55.465000+00:00'
    Page_CustomerAccountResponse_:
      title: Page of CustomerAccountResponse
      required:
      - data
      - pagination
      type: object
      properties:
        data:
          title: Data
          description: 'The elements of the response.

            '
          type: array
          items:
            $ref: '#/components/schemas/CustomerAccountResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
    BankAccountResponse:
      title: BankAccountResponse
      description: 'An object representing a bank account.

        '
      required:
      - iban
      - bic
      type: object
      properties:
        iban:
          title: IBAN
          type: string
          description: 'An IBAN (International Bank Account Number) according to ISO 13616-1:2020.

            '
        bic:
          title: BIC
          type: string
          description: 'A BIC (Business Identifier Code) according to ISO 9362.

            '
        name:
          type: string
          title: Name
          description: 'The name of the bank managing the bank account.

            '
    Action:
      title: Action
      description: 'An object representing an action that either needs to be performed or that needed to be performed in the past.

        '
      oneOf:
      - $ref: '#/components/schemas/CompleteIdentificationAction'
      - $ref: '#/components/schemas/EnrollSCAAuthenticatorAction'
      - $ref: '#/components/schemas/InitiateIdentityVerificationAction'
      - $ref: '#/components/schemas/PendingCheckAction'
      - $ref: '#/components/schemas/ProvideSCARecoveryCodeAction'
      - $ref: '#/components/schemas/SubmitDocumentAction'
      discriminator:
        propertyName: type
        mapping:
          complete_identification: '#/components/schemas/CompleteIdentificationAction'
          enroll_sca_authenticator: '#/components/schemas/EnrollSCAAuthenticatorAction'
          initiate_identity_verification: '#/components/schemas/InitiateIdentityVerificationAction'
          proof_of_address: '#/components/schemas/PendingCheckAction'
          provide_recovery_code: '#/components/schemas/ProvideSCARecoveryCodeAction'
          submit_document: '#/components/schemas/SubmitDocumentAction'
          tax_identification: '#/components/schemas/PendingCheckAction'
    IndustrySector:
      title: IndustrySector
      enum:
      - agriculture
      - commodities
      - construction
      - education
      - financial_services
      - gambling
      - healthcare
      - it
      - jewellery_trading
      - manufacturing
      - precious_metals_trading
      - professional_services
      - public_sector
      - real_estate
      - retail
      - service_industry
      - sport
      - tourism
      - transport
      - used_vehicles_trading
      - weapons_trading
      - other
      type: string
      description: 'A category representing the industry sector related to a user''s employment status.  If the user''s employment status is not directly linked to a sector, select `other`.

        <ul> <li><code>agriculture</code></li> <li><code>commodities</code></li> <li><code>construction</code></li> <li><code>education</code></li> <li><code>financial_services</code></li> <li><code>gambling</code></li> <li><code>healthcare</code></li> <li><code>it</code></li> <li><code>jewellery_trading</code></li> <li><code>manufacturing</code></li> <li><code>precious_metals_trading</code></li> <li><code>professional_services</code></li> <li><code>public_sector</code></li> <li><code>real_estate</code></li> <li><code>retail</code></li> <li><code>service_industry</code></li> <li><code>sport</code></li> <li><code>tourism</code></li> <li><code>transport</code></li> <li><code>used_vehicles_trading</code></li> <li><code>weapons_trading</code></li> <li><code>other</code></li> </ul>

        '
    ExperienceDetail-Input:
      properties:
        experience:
          $ref: '#/components/schemas/ExperienceType'
        knowledge:
          $ref: '#/components/schemas/KnowledgeLevelType'
      type: object
      required:
      - knowledge
      title: ExperienceDetail
    ExperienceDetail-Output:
      properties:
        experience:
          $ref: '#/components/schemas/ExperienceType'
        knowledge:
          $ref: '#/components/schemas/KnowledgeLevelType'
      type: object
      required:
      - knowledge
      title: ExperienceDetail
    broker__apps__api__endpoints__accounts__SecuritiesAccountResponse:
      description: 'An object representing the account information for the customer''s securities account.

        '
      properties:
        number:
          title: Account Number
          type: string
          description: 'A string representing the account number for the securities account.

            '
      type: object
      required:
      - number
      title: SecuritiesAccountResponse
    PlaceOfBirthRequest:
      title: PlaceOfBirthRequest
      description: 'An object representing a place of birth.

        '
      required:
      - city
      - country
      type: object
      properties:
        city:
          title: City
          maxLength: 255
          type: string
          description: 'The city/municipality of the place of birth.

            '
          example: Berlin
        country:
          title: Country
          maxLength: 2
          minLength: 2
          type: string
          example: DE
          description: 'An ISO 3166-1 alpha-2 code, representing the country related to the place of birth.

            '
    CreateAccountRequest:
      title: CreateAccountRequest
      required:
      - customer
      - accepted_agreements
      - declaration_of_acting_on_own_account
      type: object
      properties:
        customer:
          oneOf:
          - $ref: '#/components/schemas/CustomerRequest'
          - $ref: '#/components/schemas/BusinessCustomerRequest'
          - $ref: '#/components/schemas/PersonCustomerRequest'
          title: Customer
        accepted_agreements:
          title: Accepted Agreements
          description: 'A list of legal agreements that have been accepted by the user.

            '
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/broker__apps__api__endpoints__accounts__AgreementAcceptanceRequest'
        declaration_of_acting_on_own_account:
          title: Declaration of Acting on Own Account
          type: boolean
          description: 'An boolean value indicating whether the user has explicitly stated that they are acting on their own account and not in someone else''s name.

            '
          default: false
        metadata:
          title: Metadata
          type: object
          description: 'Optional metadata for the account as key-value pairs.

            '
          additionalProperties:
            type: string
    CustomerAccountCheckStatus:
      title: CustomerAccountCheckStatus
      enum:
      - action_required
      - processing
      - success
      - failure
      type: string
      description: 'A category describing the status of an account check:

        <ul> <li><code>action_required</code>: An action is required to move forward with this check. <li><code>processing</code>: This check is in progress. <li><code>success</code>: This check was completed. <li><code>failure</code>: This check has failed. </ul>

        '
    CreateAuthenticatorRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: 'Name for the authenticator being registered.  When binding to a specific device, it may be a good idea to use the device''s model name, like `iPhone14,1`.  This will help when the user has more than one authenticator registered for an account.

            **NOTE:** At the moment, there is no way to register a second authenticator, but this feature will be added in the future.

            '
        public_key:
          type: string
          title: Public Key
          description: 'Base64-url encoded form of the public key.  See our guide on strong customer authentication for more details on the formats supported.

            '
        client_credential_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Client Credential Identifier
          description: 'Client side credential identifier of when the key pair was generated.  This identifier will be used to indicate the authenticator that created a signature.

            '
        recovery_code:
          type: string
          minLength: 1
          pattern: ^\d{6}$
          title: Authenticator Recovery Code
          description: 'When resetting the authenticator, use this property to provide the recovery code from lemon.markets. The format is a six-digit string like `"123456"`.

            '
        verification:
          $ref: '#/components/schemas/VerificationRequest'
      type: object
      required:
      - name
      - public_key
      - client_credential_id
      title: CreateAuthenticatorRequest
      example:
        client_credential_id: adfd5154-c39c-41c5-a88d-f3e6a2aded9e
        name: Happy 🍋
        public_key: pSJYIO1qxZIy0bSkO0djjJtdFFVU5K0v1l76XJQba8DNw3xXAQIgAQMmIVggh3uzl_vqfplJX8P3T-rdhEbkO_XX5dDkuGjFO0kRr5w=
        verification:
          nonce: <base64-url encoded random data>
          signature: <base64-url encoded signature for `nonce` using `public_key`>
    broker__apps__api__endpoints__accounts__AgreementAcceptanceRequest:
      title: AgreementAcceptance
