aid: lemonmarkets
name: lemon.markets
description: lemon.markets is a Berlin-based, BaFin-licensed investment firm that sells brokerage infrastructure
  as an API. Its Brokerage API lets fintechs, banks and platforms embed investing — account opening and
  KYC/identification, securities accounts, order placement and execution, trades, positions, transactions,
  withdrawals, settlements, corporate actions, income distributions, tax exemption orders (Freistellungsauftrag)
  and treasury products — without building or licensing a broker-dealer stack themselves. Coverage spans
  10,000+ ETFs, ETPs, stocks, bonds and funds, and the platform supports omnibus, fully disclosed and
  BPO (business process outsourcing) operating models. The REST API is complemented by a webhook/event
  surface, an Idempotency-Key contract on order placement, and a sandbox environment with published test
  ISINs. API access is invite-only.
