webhook_testing:
  approach: >-
    The webhook setup guide walks through registering a webhook.site URL against
    POST /v1/webhooks with the event list ["account.created"], then triggering it by
    creating an account in sandbox.
  docs: https://developer.lemon.markets/docs/webhooks-setup
  first_party_tooling: none published

