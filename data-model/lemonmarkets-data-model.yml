notes:
- The account (cusa_) is the aggregate root; 57 of 96 operations take an account_id path parameter.
- Business customers add a second identity subtree (business -> legal representatives, beneficial owners).
- Every state transition on order, batch_order, withdrawal, workflow, treasury_mandate and
  tax_exemption_order is mirrored by a webhook event type — see asyncapi/lemonmarkets-brokerage-webhooks.yml.
- Confirm/cancel are modelled as sub-resource POSTs rather than PATCHes on the parent.
